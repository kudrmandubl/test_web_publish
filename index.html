        function resizeCanvas() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Расчет ширины и высоты
            const sourceAspectRatio = 3 / 4; // соотношение сторон
            const windowAspectRatio = windowWidth / windowHeight;
            const targetAspectRatio = 0;

            // если экран вытянутый по вертикали - растягиваем на весь экран
            if (windowAspectRatio < sourceAspectRatio) {
                targetAspectRatio = windowAspectRatio;
            }
            // если по горизонтали - держим соотношение 3/4
            else {
                targetAspectRatio = sourceAspectRatio;
            }

            canvas.style.aspectRatio = targetAspectRatio;
            const calculatedWidth = Math.min(windowHeight * targetAspectRatio, windowWidth);
            canvas.style.width = calculatedWidth;
        }

        // Повешиваем обработчик события изменения размера окна
        window.addEventListener('resize', resizeCanvas);

        // Вызовем функцию при загрузке
        resizeCanvas();

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/fish_test.loader.js";
        const config = {

        const script = document.createElement("script");

                let rounded = Math.round(pr);

                document.getElementById("loader-fill").style.width = pr + "%";
                document.getElementById("loader-text").textContent = "Loading " + rounded + "%";
            }).then((unityInstance) => {
