                    </div>
                </div>
            </div>
            <div id="loader-text">Loading&nbsp;0%</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("unity-canvas");
        const container = document.getElementById("unity-container");

        function unityShowBanner(msg, type) {

            //   setTimeout(function() {
            //     warningBanner.removeChild(div);

            //   }, 5000);
            // }
            // updateBannerVisibility();
        }

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/fish_story_1.6.51_ytp.loader.js";
        const config = {
            dataUrl: buildUrl + "/fish_story_1.6.51_ytp.data.unityweb",
            frameworkUrl: buildUrl + "/fish_story_1.6.51_ytp.framework.js.unityweb",
            codeUrl: buildUrl + "/fish_story_1.6.51_ytp.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Joybits",
            productName: "Fish Story",
            productVersion: "1.6.52",
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.head.appendChild(meta);
            //config.devicePixelRatio = 1;
        }

        const script = document.createElement("script");
        var unityGameInstance = null;
        script.src = loaderUrl;
        script.onload = () => {

            let filling = false; // флаг, чтобы запускать заполнение только один раз
            let fillStartTime = null;
            const fillDuration = 2 * 1000; // N секунд в миллисекундах
            let realLoadingStopValue = 90;

            const animateFill = () => {
                if (!filling) return;

                const elapsed = performance.now() - fillStartTime;
                const fillProgress = Math.min(elapsed / fillDuration, 1);
                let pr = realLoadingStopValue + fillProgress * 10;

                if (fillProgress >= 1) {
                    pr = 100;
                    filling = false; // остановить анимацию
                }

                // Обновляем прогрессбар и текст
                setProgress(pr);

                if (filling) {
                    requestAnimationFrame(animateFill);
                }
            };

            const setProgress = (pr) => {
                let rounded = Math.round(pr);
                document.getElementById("loader-fill").style.width = pr + "%";
                document.getElementById("loader-text").textContent = "Loading " + rounded + "%";
            }

            createUnityInstance(canvas, config, (progress) => {
                let pr = progress * 100;
                if (pr >= realLoadingStopValue && !filling) {
                    // Запускаем заполнение с realLoadingStopValue до 100
                    filling = true;
                    fillStartTime = performance.now();
                    animateFill();
                }

                setProgress(pr);
            }).then((unityInstance) => {
                unityGameInstance = unityInstance;
                document.getElementById("loader").style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);

    </script>

</body>
