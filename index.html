        const script = document.createElement("script");
        var unityGameInstance = null;
        script.src = loaderUrl;
        script.onload = () => {

            createUnityInstance(canvas, config, (progress) => {
                let pr = progress * 100;
                if (pr >= 90) pr = 100;
                let rounded = Math.round(pr);

                document.getElementById("loader-fill").style.width = pr + "%";
                document.getElementById("loader-text").textContent = "Loading " + rounded + "%";
            }).then((unityInstance) => {
                unityGameInstance = unityInstance;
                document.getElementById("loader").style.display = "none";
            }).catch((message) => {
